<script>
  (function () {
    'use strict';

    var MAX_INPUT_BYTES = 20 * 1024 * 1024;
    var MAX_OUTPUT_BYTES = 750 * 1024;
    var MAX_EDGE = 1600;
    var MAX_SOURCE_EDGE = 16384;
    var MAX_SOURCE_PIXELS = 50000000;
    var MIME_TYPES = ['image/jpeg', 'image/png', 'image/webp'];
    var binding = null;

    function validateFile(file) {
      if (!file || !Number.isFinite(file.size) || file.size <= 0) throw new Error('Бос немесе оқылмайтын файл. Басқа фотосуретті таңдаңыз.');
      if (file.size > MAX_INPUT_BYTES) throw new Error('Файл 20 МБ-тан үлкен. Көлемі кішірек фотосуретті таңдаңыз.');
      if (file.type && MIME_TYPES.indexOf(file.type.toLowerCase()) === -1) throw new Error('JPEG, PNG немесе WebP фотосуретін таңдаңыз. HEIC және басқа форматтарды алдымен JPEG-ке ауыстырыңыз.');
    }

    function detectMime(bytes) {
      if (bytes.length >= 3 && bytes[0] === 255 && bytes[1] === 216 && bytes[2] === 255) return 'image/jpeg';
      if (bytes.length >= 8 && [137, 80, 78, 71, 13, 10, 26, 10].every(function (value, index) { return bytes[index] === value; })) return 'image/png';
      if (bytes.length >= 12 && bytes[0] === 82 && bytes[1] === 73 && bytes[2] === 70 && bytes[3] === 70 && bytes[8] === 87 && bytes[9] === 69 && bytes[10] === 66 && bytes[11] === 80) return 'image/webp';
      return '';
    }

    function invalidDimensions() {
      throw new Error('Фотосуреттің бастапқы өлшемін қауіпсіз анықтау мүмкін болмады. Файлды JPEG, PNG немесе WebP ретінде қайта сақтап көріңіз.');
    }

    function checkSourceDimensions(width, height) {
      if (!Number.isSafeInteger(width) || !Number.isSafeInteger(height) || width <= 0 || height <= 0) invalidDimensions();
      if (width > MAX_SOURCE_EDGE || height > MAX_SOURCE_EDGE || width * height > MAX_SOURCE_PIXELS) {
        throw new Error('Фотосурет тым үлкен: 50 мегапиксельден және әр жағы 16 384 пиксельден аспауы керек. Алдымен суретті кішірейтіп, қайта таңдаңыз.');
      }
      return { width: width, height: height };
    }

    // Read only the encoded bytes (already capped at 20 MiB), never pixels.
    // JPEG metadata can precede SOF anywhere in the file, so no fixed-offset guess.
    function sourceDimensions(bytes, mimeType) {
      function be16(at) { return bytes[at] * 256 + bytes[at + 1]; }
      function be32(at) { return bytes[at] * 16777216 + bytes[at + 1] * 65536 + bytes[at + 2] * 256 + bytes[at + 3]; }
      function le24(at) { return bytes[at] + bytes[at + 1] * 256 + bytes[at + 2] * 65536; }
      function le32(at) { return le24(at) + bytes[at + 3] * 16777216; }
      function fourCC(at) { return String.fromCharCode(bytes[at], bytes[at + 1], bytes[at + 2], bytes[at + 3]); }
      if (detectMime(bytes) !== mimeType) invalidDimensions();
      if (mimeType === 'image/png') {
        if (bytes.length < 33 || be32(8) !== 13 || fourCC(12) !== 'IHDR' || bytes[26] !== 0 || bytes[27] !== 0 || bytes[28] > 1) invalidDimensions();
        return checkSourceDimensions(be32(16), be32(20));
      }
      if (mimeType === 'image/jpeg') {
        var at = 2;
        while (at < bytes.length) {
          if (bytes[at++] !== 255) invalidDimensions();
          while (bytes[at] === 255) at += 1;
          var marker = bytes[at++];
          if (marker === 0 || marker === 1 || (marker >= 208 && marker <= 218) || at + 2 > bytes.length) invalidDimensions();
          var length = be16(at), end = at + length;
          if (length < 2 || end > bytes.length) invalidDimensions();
          // SOF0/1/2 are ordinary sequential/progressive JPEG frames.
          if (marker === 192 || marker === 193 || marker === 194) {
            var components = bytes[at + 7];
            if (length < 11 || [8, 12].indexOf(bytes[at + 2]) === -1 || !components || components > 4 || length !== 8 + components * 3) invalidDimensions();
            return checkSourceDimensions(be16(at + 5), be16(at + 3));
          }
          // Unsupported frame modes cannot supply a trusted canvas size.
          if (marker >= 192 && marker <= 207 && [196, 200, 204].indexOf(marker) === -1) invalidDimensions();
          at = end;
        }
        invalidDimensions();
      }
      if (mimeType === 'image/webp') {
        if (bytes.length < 26 || le32(4) + 8 !== bytes.length) invalidDimensions();
        var chunk = fourCC(12), chunkLength = le32(16);
        if (chunkLength + 20 + (chunkLength % 2) > bytes.length) invalidDimensions();
        if (chunk === 'VP8X') {
          if (chunkLength !== 10 || bytes.length < 30 || (bytes[20] & 193) || bytes[21] || bytes[22] || bytes[23]) invalidDimensions();
          return checkSourceDimensions(le24(24) + 1, le24(27) + 1);
        }
        if (chunk === 'VP8 ') {
          if (chunkLength < 10 || bytes.length < 30 || (bytes[20] & 1) || bytes[23] !== 157 || bytes[24] !== 1 || bytes[25] !== 42) invalidDimensions();
          return checkSourceDimensions((bytes[26] + bytes[27] * 256) & 16383, (bytes[28] + bytes[29] * 256) & 16383);
        }
        if (chunk === 'VP8L') {
          if (chunkLength < 5 || bytes[20] !== 47 || (bytes[24] & 224)) invalidDimensions();
          return checkSourceDimensions(1 + bytes[21] + ((bytes[22] & 63) * 256), 1 + (bytes[22] >> 6) + bytes[23] * 4 + (bytes[24] & 15) * 1024);
        }
      }
      invalidDimensions();
    }

    async function inspectSource(file) {
      validateFile(file);
      var bytes = new Uint8Array(await readBuffer(file));
      var signature = detectMime(bytes);
      if (!signature || (file.type && signature !== file.type.toLowerCase())) throw new Error('Файлдың мазмұны JPEG, PNG немесе WebP форматына сәйкес келмейді.');
      return sourceDimensions(bytes, signature);
    }

    function scaledDimensions(width, height, maxEdge) {
      if (!Number.isFinite(width) || !Number.isFinite(height) || width <= 0 || height <= 0) throw new Error('Фотосуреттің өлшемін оқу мүмкін болмады.');
      var ratio = Math.min(1, maxEdge / Math.max(width, height));
      return { width: Math.max(1, Math.round(width * ratio)), height: Math.max(1, Math.round(height * ratio)) };
    }

    function jpegName(name) {
      var base = String(name || '').split(/[\\/]/).pop().replace(/\.[^.]*$/, '').replace(/[\u0000-\u001f\u007f]/g, '').trim().slice(0, 100);
      return (base || 'forest-photo') + '.jpg';
    }

    function readBuffer(blob) {
      if (typeof blob.arrayBuffer === 'function') return blob.arrayBuffer();
      return new Promise(function (resolve, reject) {
        var reader = new window.FileReader();
        reader.onload = function () { resolve(reader.result); };
        reader.onerror = function () { reject(new Error('Файлды оқу мүмкін болмады.')); };
        reader.readAsArrayBuffer(blob);
      });
    }

    function loadImageElement(file) {
      return new Promise(function (resolve, reject) {
        var url = window.URL.createObjectURL(file);
        var image = new window.Image();
        image.onload = function () {
          window.URL.revokeObjectURL(url);
          resolve({ image: image, width: image.naturalWidth, height: image.naturalHeight, close: function () { image.src = ''; } });
        };
        image.onerror = function () {
          window.URL.revokeObjectURL(url);
          reject(new Error('Фотосурет ашылмады. Файл зақымдалмағанын тексеріп, қайта таңдаңыз.'));
        };
        image.src = url;
      });
    }

    async function decodeImage(file) {
      if (typeof window.createImageBitmap === 'function') {
        try {
          var bitmap = await window.createImageBitmap(file, { imageOrientation: 'from-image' });
          return { image: bitmap, width: bitmap.width, height: bitmap.height, close: function () { bitmap.close(); } };
        } catch (error) { /* Older browsers may decode this format through Image instead. */ }
      }
      return loadImageElement(file);
    }

    function canvasBlob(canvas, quality) {
      return new Promise(function (resolve, reject) {
        canvas.toBlob(function (blob) {
          if (!blob || blob.type !== 'image/jpeg') reject(new Error('Браузер фотосуретті JPEG-ке ауыстыра алмады. Браузерді жаңартып көріңіз.'));
          else resolve(blob);
        }, 'image/jpeg', quality);
      });
    }

    function blobBase64(blob) {
      return new Promise(function (resolve, reject) {
        var reader = new window.FileReader();
        reader.onload = function () {
          var value = String(reader.result || '');
          var prefix = 'data:image/jpeg;base64,';
          if (value.indexOf(prefix) !== 0) reject(new Error('Фотосуретті жіберуге дайындау мүмкін болмады.'));
          else resolve(value.slice(prefix.length));
        };
        reader.onerror = function () { reject(new Error('Фотосуретті жіберуге дайындау мүмкін болмады.')); };
        reader.readAsDataURL(blob);
      });
    }

    async function compressPhoto(file) {
      await inspectSource(file); // Must finish before createImageBitmap/Image.
      var decoded = await decodeImage(file);
      var canvas = document.createElement('canvas');
      try {
        checkSourceDimensions(decoded.width, decoded.height);
        var context = canvas.getContext('2d');
        if (!context || typeof canvas.toBlob !== 'function') throw new Error('Бұл браузер фотосуретті дайындауды қолдамайды. Жаңартылған браузер қолданыңыз.');
        var sizes = [MAX_EDGE, 1280, 1024, 800];
        var qualities = [0.86, 0.76, 0.66, 0.56];
        for (var sizeIndex = 0; sizeIndex < sizes.length; sizeIndex += 1) {
          var dimensions = scaledDimensions(decoded.width, decoded.height, sizes[sizeIndex]);
          canvas.width = dimensions.width;
          canvas.height = dimensions.height;
          context.fillStyle = '#ffffff';
          context.fillRect(0, 0, canvas.width, canvas.height);
          context.drawImage(decoded.image, 0, 0, canvas.width, canvas.height);
          for (var qualityIndex = 0; qualityIndex < qualities.length; qualityIndex += 1) {
            var blob = await canvasBlob(canvas, qualities[qualityIndex]);
            if (blob.size > 0 && blob.size <= MAX_OUTPUT_BYTES) {
              return {
                payload: { name: jpegName(file.name), mimeType: 'image/jpeg', base64: await blobBase64(blob) },
                blob: blob,
                width: dimensions.width,
                height: dimensions.height
              };
            }
          }
        }
        throw new Error('Фотосурет 750 КБ шегіне дейін қысқармады. Көлемі кішірек фото таңдаңыз.');
      } finally {
        decoded.close();
        canvas.width = 0;
        canvas.height = 0;
      }
    }

    function clearSlot(slot, clearInput) {
      slot.version += 1;
      slot.file = null;
      slot.result = null;
      slot.error = null;
      slot.pending = null;
      if (slot.previewUrl) window.URL.revokeObjectURL(slot.previewUrl);
      slot.previewUrl = '';
      slot.preview.removeAttribute('src');
      slot.preview.hidden = false;
      slot.previewBox.hidden = true;
      slot.fileName.textContent = '';
      slot.errorElement.textContent = '';
      slot.errorElement.hidden = true;
      slot.status.textContent = 'Файл таңдалмаған.';
      slot.container.removeAttribute('aria-busy');
      slot.input.removeAttribute('aria-invalid');
      slot.input.setCustomValidity('');
      if (clearInput) slot.input.value = '';
    }

    function selectFile(slot) {
      var file = slot.input.files && slot.input.files[0];
      clearSlot(slot, false);
      if (!file) return;
      slot.file = file;
      var version = slot.version;
      slot.container.setAttribute('aria-busy', 'true');
      slot.status.textContent = 'Фотосурет дайындалуда…';
      slot.previewBox.hidden = false;
      slot.preview.hidden = true;
      slot.fileName.textContent = String(file.name || 'Фотосурет');
      slot.pending = compressPhoto(file)
        .then(function (result) {
          if (version !== slot.version) return;
          slot.result = result.payload;
          slot.previewUrl = window.URL.createObjectURL(result.blob);
          slot.preview.src = slot.previewUrl;
          slot.preview.hidden = false;
          slot.previewBox.hidden = false;
          slot.fileName.textContent = result.payload.name;
          slot.status.textContent = 'Жіберуге дайын: JPEG · ' + result.width + ' × ' + result.height + ' пиксель · ' + Math.ceil(result.blob.size / 1024) + ' КБ. Әлі жіберілген жоқ.';
        })
        .catch(function (error) {
          if (version !== slot.version) return;
          slot.error = error instanceof Error ? error : new Error('Фотосуретті дайындау мүмкін болмады.');
          slot.errorElement.textContent = slot.error.message;
          slot.errorElement.hidden = false;
          slot.status.textContent = 'Фотосурет дайын емес. Басқа файл таңдаңыз немесе алып тастаңыз.';
          slot.previewBox.hidden = false;
          slot.preview.hidden = true;
          slot.fileName.textContent = String(file.name || 'Фотосурет');
          slot.input.setCustomValidity(slot.error.message);
          slot.input.setAttribute('aria-invalid', 'true');
        })
        .finally(function () {
          if (version === slot.version) slot.container.removeAttribute('aria-busy');
        });
    }

    function bind(form) {
      if (!form || !form.elements) throw new Error('Фото формасы табылмады.');
      if (binding && binding.form === form) return api;
      if (binding) {
        reset();
        binding.slots.forEach(function (slot) {
          slot.input.removeEventListener('change', slot.onChange);
          slot.remove.removeEventListener('click', slot.onRemove);
        });
        binding.form.removeEventListener('reset', reset);
      }
      var slots = ['treePhoto', 'organPhoto'].map(function (name) {
        var container = form.querySelector('[data-photo-field="' + name + '"]');
        var input = form.elements.namedItem(name);
        if (!container || !input) throw new Error('Фотосурет өрісі табылмады: ' + name);
        var slot = {
          input: input, container: container, version: 0, file: null, result: null, error: null, pending: null, previewUrl: '',
          payloadKey: name === 'treePhoto' ? 'photoFile' : 'organPhotoFile',
          preview: container.querySelector('[data-photo-preview]'),
          previewBox: container.querySelector('[data-photo-preview-box]'),
          fileName: container.querySelector('[data-photo-file-name]'),
          status: container.querySelector('[data-photo-status]'),
          errorElement: container.querySelector('[data-photo-error]'),
          remove: container.querySelector('[data-photo-remove]')
        };
        slot.onChange = function () { slot.preview.hidden = false; selectFile(slot); };
        slot.onRemove = function () { clearSlot(slot, true); slot.preview.hidden = false; slot.input.focus(); };
        input.addEventListener('change', slot.onChange);
        slot.remove.addEventListener('click', slot.onRemove);
        return slot;
      });
      binding = { form: form, slots: slots };
      form.addEventListener('reset', reset);
      slots.forEach(function (slot) { if (slot.input.files && slot.input.files.length) selectFile(slot); });
      return api;
    }

    async function prepare() {
      if (!binding) throw new Error('Фото модулі іске қосылмаған. Бетті қайта жүктеңіз.');
      var result = { photoFile: null, organPhotoFile: null };
      for (var index = 0; index < binding.slots.length; index += 1) {
        var slot = binding.slots[index];
        if ((slot.input.files && slot.input.files[0] || null) !== slot.file) selectFile(slot);
        while (slot.pending) {
          var pending = slot.pending;
          await pending;
          if (pending === slot.pending) break;
        }
        if (slot.error) { slot.input.focus(); throw slot.error; }
        if (slot.file && !slot.result) throw new Error('Фотосурет әлі дайын емес. Қайта көріңіз.');
        result[slot.payloadKey] = slot.result;
      }
      return result;
    }

    function reset() {
      if (binding) binding.slots.forEach(function (slot) { clearSlot(slot, true); slot.preview.hidden = false; });
    }

    var api = Object.freeze({ bind: bind, prepare: prepare, reset: reset });
    window.ForestPhotoUpload = api;
  }());
</script>

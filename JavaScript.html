      {

        conclusion: 'Тікенекті бұтақ, қалақшалы жапырақ және қызыл көпсүйекті жеміс — негізгі диагностикалық белгілер.',
        publishedAt: '2026-09-23T09:00:00+05:00',
        passportUrl: ''
      }
    ];

    document.addEventListener('DOMContentLoaded', initialise);

    function initialise() {
      cacheElements();
      setupNavigation();
      setupRevealAnimations();
      setupCatalog();
      setupForm();
      setupPassportControls();
      setupQrGenerator();
      setupPhotoControls();
      updateModeLabel();
      if (new URL(window.location.href).searchParams.get('tree') || window.__INITIAL_TREE_ID__) showOnlyPassport();
      else showPage(pageForHash(validSectionHash(window.location.hash)));
      loadBootstrap();
    }

    function cacheElements() {
      elements.header = document.querySelector('.site-header');
      elements.navToggle = document.querySelector('.nav-toggle');
      elements.nav = document.getElementById('main-nav');
      elements.catalogForm = document.getElementById('catalog-filter');
      elements.catalogQuery = document.getElementById('catalog-query');
      elements.catalogStructure = document.getElementById('catalog-structure');
      elements.catalogGrid = document.getElementById('catalog-grid');
      elements.catalogCount = document.getElementById('catalog-count');
      elements.catalogEmpty = document.getElementById('catalog-empty');
      elements.catalogEmptyMessage = document.getElementById('catalog-empty-message');
      elements.treeForm = document.getElementById('tree-form');
      elements.formError = document.getElementById('form-error');
      elements.submitButton = document.getElementById('submit-button');
      elements.progressBar = document.getElementById('form-progress-bar');
      elements.requiredProgress = document.getElementById('required-progress');
      elements.stepBack = document.getElementById('step-back');
      elements.stepNext = document.getElementById('step-next');
      elements.formNavigation = document.getElementById('form-navigation');
      elements.formSteps = Array.from(document.querySelectorAll('[data-form-step]'));
      elements.successPanel = document.getElementById('success-panel');
      elements.passport = document.getElementById('passport');
      elements.passportContent = document.getElementById('passport-content');
      elements.toast = document.getElementById('toast');
      elements.qrForm = document.getElementById('qr-generator-form');
      elements.qrTarget = document.getElementById('qr-target');
      elements.qrTreeId = document.getElementById('qr-tree-id');
      elements.qrTreeField = document.getElementById('qr-tree-field');
      elements.qrGenerateButton = document.getElementById('qr-generate-button');
      elements.qrResult = document.getElementById('qr-result');
      elements.qrImage = document.getElementById('qr-image');
      elements.qrTargetLink = document.getElementById('qr-target-link');
      elements.qrError = document.getElementById('qr-error');
      elements.qrStatus = document.getElementById('qr-status');
    }

    function setupNavigation() {
      window.addEventListener('scroll', function () {
        elements.header.classList.toggle('scrolled', window.scrollY > 12);
      }, { passive: true });

      elements.navToggle.addEventListener('click', function () {
        var open = !document.body.classList.contains('nav-open');
        document.body.classList.toggle('nav-open', open);
        elements.navToggle.setAttribute('aria-expanded', String(open));
      });

      elements.nav.addEventListener('click', function (event) {
        if (event.target.closest('a')) closeNavigation();
      });

      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && document.body.classList.contains('nav-open')) {
          closeNavigation();
          elements.navToggle.focus();
        }
      });

      document.addEventListener('click', function (event) {
        var link = event.target.closest('a[href^="#"]');
        if (!link || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
        event.preventDefault();
        exitPassport(validSectionHash(link.getAttribute('href')), true);
      });

      if (usesAppsScriptBridge()) {
        if (window.google.script.history) {
          window.google.script.history.setChangeHandler(function (event) {
            applyRoute(event.location);
          });
        }
      } else {
        window.addEventListener('popstate', function () { readRoute(applyRoute); });
      }
    }

    function validSectionHash(hash) {
      var value = '#' + String(hash || '').replace(/^#/, '');
      return ['#home', '#catalog', '#register', '#qr-generator', '#top', '#main'].indexOf(value) !== -1 ? value : '#home';
    }

    function pageForHash(hash) {
      return { '#catalog': 'catalog', '#register': 'register', '#qr-generator': 'qr' }[hash] || 'home';
    }

    function showPage(page) {
      document.querySelectorAll('main > section[data-page]').forEach(function (section) {
        section.hidden = section.getAttribute('data-page') !== page;
      });
      document.querySelectorAll('[data-page-link]').forEach(function (link) {
        if (link.getAttribute('data-page-link') === page) link.setAttribute('aria-current', 'page');
        else link.removeAttribute('aria-current');
      });
    }

    function readRoute(callback) {
      if (usesAppsScriptBridge()) {
        if (window.google.script.url) window.google.script.url.getLocation(callback);
        else callback({ parameter: { tree: window.__INITIAL_TREE_ID__ || '' }, hash: '' });
        return;
      }
      var url = new URL(window.location.href);
      callback({ parameter: { tree: url.searchParams.get('tree') || '' }, hash: url.hash });
    }

    function applyRoute(location) {
      var id = location && location.parameter && location.parameter.tree;
      if (id) openPassport(id, false);
      else exitPassport(validSectionHash(location && location.hash), false);
    }

    function pushRoute(forestId, hash) {
      var params = forestId ? { tree: forestId } : {};
      if (usesAppsScriptBridge()) {
        if (window.google.script.history) window.google.script.history.push(params, params, hash.replace(/^#/, ''));
        return;
      }
      var url = new URL(window.location.href);
      if (forestId) url.searchParams.set('tree', forestId);
      else url.searchParams.delete('tree');
      url.hash = hash;
      window.history.pushState(params, '', url.toString());
    }

    function focusHeading(section) {
      if (!section) return;
      var heading = section.querySelector('h1, h2') || section;
      heading.setAttribute('tabindex', '-1');
      heading.focus({ preventScroll: true });
    }

    function closeNavigation() {
      document.body.classList.remove('nav-open');
      elements.navToggle.setAttribute('aria-expanded', 'false');
    }

    function setupRevealAnimations() {
      var items = document.querySelectorAll('.reveal');
      if (!('IntersectionObserver' in window)) {
        items.forEach(function (item) { item.classList.add('is-visible'); });
        return;
      }
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.13 });
      items.forEach(function (item) { observer.observe(item); });
    }

    function setupCatalog() {
      elements.catalogForm.addEventListener('submit', function (event) {
        event.preventDefault();
        applyCatalogFilter();
      });
      elements.catalogQuery.addEventListener('input', debounce(applyCatalogFilter, 180));
      elements.catalogStructure.addEventListener('change', applyCatalogFilter);
      elements.catalogGrid.addEventListener('click', function (event) {
        if (event.target.closest('[data-retry-bootstrap]')) {
          loadBootstrap();
          return;
        }
        var button = event.target.closest('[data-tree-id]');
        if (button) openPassport(button.getAttribute('data-tree-id'), true);
      });
    }

    function setupForm() {
      var today = new Date();
      var dateInput = elements.treeForm.elements.studyDate;
      dateInput.max = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
      if (window.ForestPhotoUpload && typeof window.ForestPhotoUpload.bind === 'function') {
        try {
          window.ForestPhotoUpload.bind(elements.treeForm);
          state.photoUploadBound = true;
        } catch (error) {
          elements.formError.textContent = errorMessage(error);
          elements.formError.hidden = false;
        }
      }

      elements.treeForm.addEventListener('input', function (event) {
        if (event.target.setCustomValidity) event.target.setCustomValidity('');
        updateFormProgress();
      });
      elements.treeForm.addEventListener('change', updateFormProgress);
      elements.treeForm.addEventListener('submit', submitForm);
      elements.stepBack.addEventListener('click', function () { showFormStep(state.formStep - 1, true); });
      elements.stepNext.addEventListener('click', function () {
        if (validateFormStep(state.formStep)) showFormStep(state.formStep + 1, true);
      });

      document.getElementById('locate-button').addEventListener('click', fillLocation);
      document.getElementById('new-record-button').addEventListener('click', function () {
        elements.successPanel.hidden = true;
        elements.treeForm.hidden = false;
        elements.formNavigation.hidden = false;
        elements.treeForm.reset();
        clearSubmission();
        showFormStep(0, false);
        updateFormProgress();
        elements.treeForm.elements.researcher.focus();
      });
      showFormStep(0, false);
      updateFormProgress();
    }

    function showFormStep(index, focus) {
      state.formStep = Math.max(0, Math.min(elements.formSteps.length - 1, index));
      elements.formSteps.forEach(function (step, stepIndex) { step.hidden = stepIndex !== state.formStep; });
      document.querySelectorAll('[data-step-dot]').forEach(function (dot) {
        var dotIndex = Number(dot.getAttribute('data-step-dot'));
        dot.classList.toggle('is-active', dotIndex === state.formStep);
        dot.classList.toggle('is-complete', dotIndex < state.formStep);
        if (dotIndex === state.formStep) dot.setAttribute('aria-current', 'step');
        else dot.removeAttribute('aria-current');
      });
      elements.stepBack.hidden = state.formStep === 0;
      elements.stepNext.hidden = state.formStep === elements.formSteps.length - 1;
      elements.submitButton.hidden = state.formStep !== elements.formSteps.length - 1;
      if (focus) {
        var legend = elements.formSteps[state.formStep].querySelector('legend');
        legend.setAttribute('tabindex', '-1');
        legend.focus({ preventScroll: true });
        elements.treeForm.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function validateFormStep(index, report) {
      var fields = Array.from(elements.formSteps[index].querySelectorAll('input, select, textarea'));
      fields.forEach(function (field) {
        if (field.required) field.setCustomValidity(String(field.value || '').trim() ? '' : 'Міндетті өрісті толтырыңыз.');
      });
      var invalid = fields.find(function (field) { return !field.checkValidity(); });
      if (invalid) { if (report !== false) invalid.reportValidity(); return false; }
      return true;
    }

    function setupPassportControls() {
      document.getElementById('passport-back').addEventListener('click', function () { closePassport(true); });
      elements.passportContent.addEventListener('click', function (event) {
        var copyButton = event.target.closest('[data-copy-url]');
        if (copyButton) copyText(copyButton.getAttribute('data-copy-url'));
        var printButton = event.target.closest('[data-print-passport]');
        if (printButton) window.print();
        var qrButton = event.target.closest('[data-download-qr]');
        if (qrButton) downloadQr({
          url: qrButton.getAttribute('data-qr-url'),
          forestId: qrButton.getAttribute('data-qr-id')
        }, qrButton.getAttribute('data-download-qr'), qrButton);
      });
    }

    function setupQrGenerator() {
      if (!elements.qrForm) return;
      if (typeof window.addEventListener === 'function') window.addEventListener('pagehide', clearQrFiles);
      elements.qrForm.addEventListener('submit', generateSelectedQr);
      elements.qrTarget.addEventListener('change', updateQrSelection);
      elements.qrTreeId.addEventListener('input', function () {
        if (elements.qrTreeId.setCustomValidity) elements.qrTreeId.setCustomValidity('');
        resetQrResult();
        elements.qrStatus.textContent = 'FOREST ID енгізіп, жарияланған паспортты тексеріңіз.';
      });
      ['png', 'svg'].forEach(function (format) {
        var button = document.getElementById('qr-download-' + format);
        if (button) button.addEventListener('click', function () { downloadQr(state.qrDownload, format, button); });
      });
      updateQrSelection();
    }

    function resetQrResult() {
      ++state.qrRequest;
      clearQrFiles();
      state.qrDownload = null;
      elements.qrResult.hidden = true;
      elements.qrImage.innerHTML = '';
      elements.qrTargetLink.removeAttribute('href');
      elements.qrTargetLink.textContent = '';
      elements.qrError.hidden = true;
      elements.qrGenerateButton.disabled = false;
      elements.qrGenerateButton.textContent = 'QR-код жасау';
    }

    function updateQrSelection() {
      if (!elements.qrForm) return;
      resetQrResult();
      var passport = elements.qrTarget.value === 'passport';
      if (elements.qrTreeField) elements.qrTreeField.hidden = !passport;
      elements.qrTreeId.disabled = !passport || state.mode === 'preview';
      elements.qrTreeId.required = passport;
      if (elements.qrTreeId.setCustomValidity) elements.qrTreeId.setCustomValidity('');
      if (state.mode === 'preview') {
        elements.qrGenerateButton.disabled = true;
        elements.qrStatus.textContent = 'Демо режимде ортақ QR жасалмайды. Жарияланған сайтты ашыңыз.';
        return;
      }
      if (passport) {
        elements.qrStatus.textContent = 'Тек оқытушы жариялаған паспортқа QR жасалады.';
        return;
      }
      generateSelectedQr();
    }

    function generateSelectedQr(event) {
      if (event) event.preventDefault();
      if (!elements.qrForm) return Promise.resolve();
      resetQrResult();
      var request = state.qrRequest;
      if (state.mode === 'preview') {
        updateQrSelection();
        return Promise.resolve();
      }
      var siteUrl = publicSiteUrl();
      if (!siteUrl) {
        showQrError('QR жасау үшін жарияланған сайттың тұрақты мекенжайы дұрыс бапталуы керек.');
        return Promise.resolve();
      }
      if (elements.qrTarget.value === 'site') {
        try { showQrResult(siteUrl, ''); } catch (error) { showQrError(errorMessage(error)); }
        return Promise.resolve();
      }
      if (elements.qrTarget.value !== 'passport') {
        showQrError('Сайт немесе жарияланған паспорт нұсқасын таңдаңыз.');
        return Promise.resolve();
      }
      var forestId = normaliseForestId(elements.qrTreeId.value);
      if (!/^FOREST-\d{5,8}$/.test(forestId) || Number(forestId.slice(7)) < 1) {
        showQrError('FOREST ID нөмірін дұрыс енгізіңіз. Мысалы: FOREST-00001.');
        return Promise.resolve();
      }
      elements.qrTreeId.value = forestId;
      elements.qrGenerateButton.disabled = true;
      elements.qrGenerateButton.textContent = 'Тексерілуде…';
      elements.qrStatus.textContent = 'Паспорттың жарияланғаны тексерілуде…';
      return callServer('getTreePassport', forestId)
        .then(function (record) {
          if (request !== state.qrRequest) return;
          if (!record || record.forestId !== forestId || record.status !== 'ЖАРИЯЛАНДЫ') throw new Error('Жарияланған паспорт табылмады.');
          var url = publicPassportUrl(buildPassportUrl(forestId));
          if (!url) throw new Error('Паспорттың ашық мекенжайы дұрыс емес.');
          showQrResult(url, forestId);
        })
        .catch(function (error) {
          if (request === state.qrRequest) showQrError(errorMessage(error));
        })
        .finally(function () {
          if (request !== state.qrRequest) return;
          elements.qrGenerateButton.disabled = false;
          elements.qrGenerateButton.textContent = 'QR-код жасау';
        });
    }

    function showQrError(message) {
      state.qrDownload = null;
      elements.qrResult.hidden = true;
      elements.qrError.textContent = message;
      elements.qrError.hidden = false;
      elements.qrStatus.textContent = '';
    }

    function showQrResult(url, forestId) {
      var qr = createQr(url);
      elements.qrImage.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 16, scalable: true });
      elements.qrImage.setAttribute('role', 'img');
      elements.qrImage.setAttribute('aria-label', forestId ? forestId + ' паспортының QR-коды' : 'FOREST ID сайтының QR-коды');
      elements.qrTargetLink.href = url;
      elements.qrTargetLink.textContent = url;
      state.qrDownload = { url: url, forestId: forestId };
      elements.qrResult.hidden = false;
      elements.qrStatus.textContent = forestId ? forestId + ' жарияланған. QR-код дайын.' : 'Сайттың QR-коды дайын. PNG немесе SVG форматында жүктеңіз.';
    }

    function publicSiteUrl() {
      if (state.mode === 'preview') return '';
      try {
        if (hasExternalRuntime) return externalRuntime().siteUrl;
        var url = new URL(state.config.appUrl);
        if (url.protocol !== 'https:' || url.hostname !== 'script.google.com' || url.port || url.username || url.password || url.search || url.hash || !/^\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url.pathname)) return '';
        return url.toString();
      } catch (error) { return ''; }
    }

    function publicQrUrl(value) {
      if (state.mode === 'preview') return '';
      var siteUrl = publicSiteUrl();
      if (!siteUrl) return '';
      return value === siteUrl ? siteUrl : publicPassportUrl(value);
    }

    function createQr(url) {
      if (!publicQrUrl(url)) throw new Error('QR тек осы сайттың немесе жарияланған паспорттың мекенжайына жасалады.');
      if (typeof window.qrcode !== 'function') throw new Error('QR генераторы жүктелмеді. Бетті қайта жүктеңіз.');
      var qr = window.qrcode(0, 'M');
      qr.addData(url, 'Byte');
      qr.make();
      return qr;
    }

    function downloadQr(target, format, button) {
      if (!target || ['png', 'svg'].indexOf(format) === -1) return Promise.resolve();
      if (button) button.disabled = true;
      return Promise.resolve().then(function () {
        var qr = createQr(target.url);
        var forestId = /^FOREST-\d{5,8}$/.test(target.forestId) ? target.forestId : '';
        var name = (forestId || 'FOREST-ID-site') + '-QR.' + format;
        // Four white modules on every side form the scanner's quiet zone.
        if (format === 'svg') {
          saveQrBlob(new Blob([qr.createSvgTag(16, 64, forestId || 'FOREST ID', 'FOREST ID QR')], { type: 'image/svg+xml;charset=utf-8' }), name, button);
          return;
        }
        var count = qr.getModuleCount();
        var cellSize = 16;
        var margin = 4 * cellSize;
        var canvas = document.createElement('canvas');
        canvas.width = canvas.height = (count + 8) * cellSize;
        var context = canvas.getContext('2d');
        if (!context || typeof canvas.toBlob !== 'function') throw new Error('Бұл браузер PNG жүктеуді қолдамайды. SVG таңдаңыз.');
        context.fillStyle = '#ffffff';
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.fillStyle = '#000000';
        for (var row = 0; row < count; row += 1) {
          for (var column = 0; column < count; column += 1) {
            if (qr.isDark(row, column)) context.fillRect(margin + column * cellSize, margin + row * cellSize, cellSize, cellSize);
          }
        }
        return new Promise(function (resolve, reject) {
          canvas.toBlob(function (blob) {
            if (!blob) { reject(new Error('PNG жасалмады. SVG таңдаңыз.')); return; }
            try { saveQrBlob(blob, name, button); resolve(); } catch (error) { reject(error); }
          }, 'image/png');
        });
      }).then(function () {
        showToast('QR файлы дайын. Жүктелмесе, «Файлды ашу / сақтау» сілтемесін басыңыз.');
      }).catch(function (error) {
        showToast(errorMessage(error));
      }).finally(function () {
        if (button) button.disabled = false;
      });
    }

    function releaseQrFile(file) {
      window.clearTimeout(file.timer);
      window.URL.revokeObjectURL(file.url);
      if (file.fallback) file.fallback.remove();
      state.qrFiles = state.qrFiles.filter(function (item) { return item !== file; });
    }

    function clearQrFiles() {
      state.qrFiles.slice().forEach(releaseQrFile);
    }

    function saveQrBlob(blob, filename, button) {
      if (!window.URL || typeof window.URL.createObjectURL !== 'function') throw new Error('Файлды жүктеу үшін браузерді жаңартыңыз.');
      state.qrFiles.filter(function (file) { return file.button === button; }).forEach(releaseQrFile);
      while (state.qrFiles.length >= 4) releaseQrFile(state.qrFiles[0]);
      var objectUrl = window.URL.createObjectURL(blob);
      var file = { url: objectUrl, button: button, fallback: null, timer: null };
      // Embedded browsers can ignore an automatic download. Keep a real,
      // user-activated file link so the generated image can still be opened/saved.
      if (button && button.parentNode) {
        var fallback = document.createElement('div');
        fallback.style.flexBasis = '100%';
        fallback.style.textAlign = 'center';
        var openLink = document.createElement('a');
        openLink.href = objectUrl;
        openLink.target = '_blank';
        openLink.rel = 'noopener';
        openLink.title = filename;
        openLink.className = 'button qr-file-link';
        openLink.textContent = filename.slice(-3).toUpperCase() + ' файлын ашу / сақтау';
        var hint = document.createElement('p');
        hint.className = 'qr-download-help';
        hint.setAttribute('role', 'status');
        hint.textContent = 'Автоматты жүктеу ашылмаса, осы сілтемені басыңыз. Суретті ұзақ басып немесе тінтуірдің оң жақ батырмасымен сақтауға болады. Сілтеме 10 минут жарамды.';
        fallback.appendChild(openLink);
        fallback.appendChild(hint);
        button.parentNode.appendChild(fallback);
        file.fallback = fallback;
      }
      state.qrFiles.push(file);
      file.timer = window.setTimeout(function () { releaseQrFile(file); }, file.fallback ? 600000 : 10000);
      var link = document.createElement('a');
      link.href = objectUrl;
      link.download = filename;
      link.style.display = 'none';
      document.body.appendChild(link);
      try {
        link.click();
      } catch (error) {
        if (!file.fallback) { releaseQrFile(file); throw error; }
      } finally {
        link.remove();
      }
    }

    function managedPhotoMarkup(forestId, slot, alt) {
      if (state.mode === 'preview' || !/^FOREST-\d{5,8}$/.test(String(forestId)) || ['tree', 'organ'].indexOf(slot) === -1) return placeholderMarkup();
      return '<div class="managed-photo" data-photo-id="' + escapeAttribute(forestId) + '" data-photo-slot="' + slot + '" data-photo-alt="' + escapeAttribute(alt) + '" aria-busy="true">' + placeholderMarkup() + '<span data-photo-message>Фото жүктелуде…</span></div>';

    function setupPhotoControls() {
      document.addEventListener('click', function (event) {
        var retry = event.target.closest('[data-photo-retry]');
        if (!retry) return;
        var node = retry.closest('[data-photo-id][data-photo-slot]');
        if (!node || state.mode === 'preview') return;
        queuePublishedPhoto(node);
      });
    }

    function resetPhotoLoading() {
      ++state.photoEpoch;
      if (state.photoObserver) state.photoObserver.disconnect();
      state.photoObserver = null;
      state.photoQueue = [];
      // Keep the count of actual in-flight requests across route changes.
      // Old responses are ignored, and new requests still respect the limit of two.
    }

    function mountPublishedPhotos(container) {
      resetPhotoLoading();
      if (!container || state.mode === 'preview') return;
      var nodes = Array.from(container.querySelectorAll('[data-photo-id][data-photo-slot]'));
      if (!nodes.length) return;
      var epoch = state.photoEpoch;
      nodes.forEach(function (node) {
        if (node.getAttribute('data-photo-state') !== 'loaded') node.removeAttribute('data-photo-state');
      });
      if (typeof window.IntersectionObserver === 'function') {
        state.photoObserver = new window.IntersectionObserver(function (entries) {
          if (epoch !== state.photoEpoch) return;
          entries.forEach(function (entry) {
            if (!entry.isIntersecting) return;
            state.photoObserver.unobserve(entry.target);
            queuePublishedPhoto(entry.target);
          });
        }, { rootMargin: '240px 0px' });
        nodes.forEach(function (node) {
          if (node.getAttribute('data-photo-state') !== 'loaded') state.photoObserver.observe(node);
        });
      } else {
        nodes.forEach(queuePublishedPhoto);
      }
    }

    function queuePublishedPhoto(node) {
      if (state.mode === 'preview' || !node || !node.isConnected) return;
      var status = node.getAttribute('data-photo-state');
      if (['queued', 'loading', 'loaded'].indexOf(status) !== -1) return;
      var forestId = node.getAttribute('data-photo-id');
      var slot = node.getAttribute('data-photo-slot');
      if (!/^FOREST-\d{5,8}$/.test(forestId) || ['tree', 'organ'].indexOf(slot) === -1) return;
      node.setAttribute('data-photo-state', 'queued');
      node.setAttribute('aria-busy', 'true');
      var message = node.querySelector('[data-photo-message]');
      if (message) message.textContent = 'Фото жүктелуде…';
      var retry = node.querySelector('[data-photo-retry]');
      if (retry) retry.remove();
      state.photoQueue.push({ node: node, forestId: forestId, slot: slot, epoch: state.photoEpoch });
      pumpPhotoQueue();
    }

    function photoJobIsCurrent(job) {
      return job.epoch === state.photoEpoch && job.node.isConnected;
    }

    function pumpPhotoQueue() {
      while (state.photoActive < 2 && state.photoQueue.length) {
        var job = state.photoQueue.shift();
        if (!photoJobIsCurrent(job)) continue;
        startPhotoJob(job);
      }
    }

    function startPhotoJob(job) {
      state.photoActive += 1;
      job.node.setAttribute('data-photo-state', 'loading');
      callServer('getTreePhoto', { forestId: job.forestId, slot: job.slot })
        .then(function (response) {
          if (!photoJobIsCurrent(job)) return;
          var dataUrl = validatedPhotoDataUrl(response, job.forestId, job.slot);
          var image = document.createElement('img');
          image.alt = job.node.getAttribute('data-photo-alt') || 'Өсімдіктің фотосуреті';
          image.decoding = 'async';
          image.onload = function () {
            image.onload = image.onerror = null;
            if (!photoJobIsCurrent(job)) return;
            job.node.innerHTML = '';
            job.node.appendChild(image);
            job.node.setAttribute('data-photo-state', 'loaded');
            job.node.setAttribute('aria-busy', 'false');
          };
          image.onerror = function () {
            image.onload = image.onerror = null;
            if (photoJobIsCurrent(job)) showPhotoLoadError(job.node);
          };
          image.src = dataUrl;
        })
        .catch(function () {
          if (photoJobIsCurrent(job)) showPhotoLoadError(job.node);
        })
        .finally(function () {
          state.photoActive -= 1;
          pumpPhotoQueue();
        });
    }

    function showPhotoLoadError(node) {
      node.setAttribute('data-photo-state', 'error');
      node.setAttribute('aria-busy', 'false');
      node.innerHTML = placeholderMarkup() + '<span data-photo-message>Фото жүктелмеді.</span><button class="photo-retry" type="button" data-photo-retry>Қайта жүктеу</button>';
    }

    function validatedPhotoDataUrl(response, forestId, slot) {
      if (!response || response.forestId !== forestId || response.slot !== slot || typeof response.dataUrl !== 'string') throw new Error('Фото жауабы дұрыс емес.');
      var prefix = 'data:image/jpeg;base64,';
      var value = response.dataUrl;
      var limit = Math.min(768000, Number(state.config.maxPhotoBytes) || 768000);
      if (value.indexOf(prefix) !== 0 || value.length > prefix.length + Math.ceil(limit / 3) * 4) throw new Error('Фото форматы дұрыс емес.');
      var base64 = value.slice(prefix.length);
      if (!/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(base64) || !base64) throw new Error('Фото деректері дұрыс емес.');
      var binary = window.atob(base64);
      if (binary.length > limit || binary.length < 4 || binary.charCodeAt(0) !== 255 || binary.charCodeAt(1) !== 216 || binary.charCodeAt(2) !== 255 || binary.charCodeAt(binary.length - 2) !== 255 || binary.charCodeAt(binary.length - 1) !== 217) throw new Error('JPEG фотосуреті дұрыс емес.');
      return value;
    }

    function metaItem(label, value) {

      renderCatalog(records);

            '</div>',
            '<div class="passport-actions">',
              passportUrl ? '<button class="button button-dark" type="button" data-copy-url="' + escapeAttribute(passportUrl) + '">Сілтемені көшіру</button>' : '',
              passportUrl ? '<button class="button" type="button" data-download-qr="png" data-qr-url="' + escapeAttribute(passportUrl) + '" data-qr-id="' + escapeAttribute(record.forestId) + '">QR PNG жүктеу</button><button class="button" type="button" data-download-qr="svg" data-qr-url="' + escapeAttribute(passportUrl) + '" data-qr-id="' + escapeAttribute(record.forestId) + '">QR SVG жүктеу</button>' : '',
              '<button class="button" type="button" data-print-passport style="border-color:var(--line)">Басып шығару</button>',
            '</div>',
          '</aside>',
        '</div>'
      ].join('');
    }

    function passportItem(label, value) {
      return '<div><dt>' + escapeHtml(label) + '</dt><dd>' + escapeHtml(value || '—') + '</dd></div>';
    }

    function renderQr(url, forestId) {
      if (state.mode === 'preview') return '<p>Демо нұсқада QR және ортақ сілтеме жасалмайды. Жарияланған сайтта олар нақты паспортқа апарады.</p>';
      if (!url) return '<p>QR жасау үшін жарияланған сайттың тұрақты сілтемесін баптаңыз.</p>';
      if (typeof window.qrcode !== 'function') return '<p>QR-код жүктелмеді. Паспорт сілтемесін төменнен ашуға болады.</p>';
      try {
        var qr = createQr(url);
        return '<div role="img" aria-label="' + escapeAttribute(forestId + ' паспортына апаратын QR-код') + '">' + qr.createSvgTag({ cellSize: 4, margin: 16, scalable: true }) + '</div>';
      } catch (error) {
        return '<p>QR-код жасалмады. Паспорт сілтемесін төменнен ашуға болады.</p>';
      }
    }

    function submitForm(event) {
      event.preventDefault();
      if (state.submitting) return;
      elements.formError.hidden = true;
      for (var step = 0; step < elements.formSteps.length - 1; step++) {
        if (!validateFormStep(step, false)) { showFormStep(step, true); validateFormStep(step); return; }
      }
      var gps = elements.treeForm.elements.gps;
      var coordinates = gps.value.trim().split(',').map(function (value) { return value.trim(); });
      var validGps = !gps.value.trim() || (coordinates.length === 2 && coordinates.every(function (value) { return /^[-+]?\d+(?:\.\d+)?$/.test(value); }) && Math.abs(Number(coordinates[0])) <= 90 && Math.abs(Number(coordinates[1])) <= 180);
      gps.setCustomValidity(validGps ? '' : 'GPS мәнін ендік, бойлық түрінде енгізіңіз. Мысалы: 43.238949, 76.889709.');
      if (!validateFormStep(elements.formSteps.length - 1)) {
        showFormStep(elements.formSteps.length - 1, false);
        validateFormStep(elements.formSteps.length - 1);
        return;
      }

      var payload = {};
      // File inputs are prepared separately; raw File objects must never enter
      // JSON or demo storage. Capture text before disabling form controls.
      new FormData(elements.treeForm).forEach(function (value, key) {
        if (key !== 'treePhoto' && key !== 'organPhoto' && typeof value === 'string') payload[key] = value;
      });
      setSubmitting(true);
      return prepareSubmissionPayload(payload)
        .then(function (prepared) {
          return payloadFingerprint(prepared).then(function (fingerprint) {
            prepared.requestId = submissionId({ payloadSha256: fingerprint });
            return callServer('submitTree', prepared);
          });
        })
        .then(function (result) {
          if (!result || !result.ok || !/^FOREST-\d{5,8}$/.test(String(result.forestId || ''))) throw new Error('Сақтау нәтижесі расталмады.');
          setSubmitting(false);
          clearSubmission();
          elements.treeForm.hidden = true;
          elements.formNavigation.hidden = true;
          document.getElementById('success-id').textContent = result.forestId;
          document.getElementById('success-message').textContent = result.message || 'Жазба оқытушының тексеруіне жіберілді.';
          elements.successPanel.hidden = false;
          elements.successPanel.focus();
          showToast(result.forestId + ' нөмірі берілді');
        })
        .catch(function (error) {
          setSubmitting(false);
          elements.formError.textContent = errorMessage(error) + ' Сақтау расталмады. Қайта жіберу үшін мәліметтерді өзгертпей осы батырманы басыңыз: сұрау нөмірі сақталады.';
          elements.formError.hidden = false;
          elements.formError.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
    }

    function setSubmitting(isSubmitting) {
      state.submitting = isSubmitting;
      Array.from(elements.treeForm.elements).forEach(function (field) { field.disabled = isSubmitting; });
      elements.submitButton.disabled = isSubmitting;
      elements.stepBack.disabled = isSubmitting;
      elements.stepNext.disabled = isSubmitting;
      elements.submitButton.querySelector('span').textContent = isSubmitting ? 'Сақталуда…' : 'Зерттеуді жіберу';
    }

    function selectedPhotoFiles() {
      return ['treePhoto', 'organPhoto'].some(function (name) {
        var field = elements.treeForm.elements[name];
        return Boolean(field && field.files && field.files.length);
      });
    }

    function assertPhotoUploadsAvailable() {
      if (state.mode === 'preview') throw new Error('Демо режимде фото серверге жіберілмейді. Фотоларды алып тастаңыз немесе жарияланған сайтты ашыңыз.');
      if (!state.connected || state.config.photoUploadsEnabled !== true) throw new Error('Фото жүктеу серверде дайын емес немесе қосылым расталмады. Бетті қайта жүктеңіз немесе фотосыз жіберіңіз.');
    }

    function prepareSubmissionPayload(payload) {
      return Promise.resolve().then(function () {
        var selected = selectedPhotoFiles();
        if (selected) {
          assertPhotoUploadsAvailable();
          if (!state.photoUploadBound || !window.ForestPhotoUpload || typeof window.ForestPhotoUpload.prepare !== 'function') throw new Error('Фото модулі іске қосылмады. Бетті қайта жүктеңіз.');
        }
        if (!state.photoUploadBound) return { photoFile: null, organPhotoFile: null };
        return window.ForestPhotoUpload.prepare();
      }).then(function (files) {
        ['photoFile', 'organPhotoFile'].forEach(function (key) {
          var file = files && files[key];
          if (!file) return;
          assertPhotoUploadsAvailable();
          var maxBytes = Math.min(768000, Number(state.config.maxPhotoBytes) || 768000);
          if (typeof file !== 'object' || file.mimeType !== 'image/jpeg' || typeof file.base64 !== 'string' || !file.base64 || file.base64.length > Math.ceil(maxBytes / 3) * 4) throw new Error('Фото сервер рұқсат еткен JPEG өлшеміне сәйкес келмейді. Кішірек фото таңдаңыз.');
          payload[key] = file;
        });
        return payload;
      });
    }

    function payloadFingerprint(payload) {
      if (!window.crypto || !window.crypto.subtle || typeof window.TextEncoder !== 'function') return Promise.reject(new Error('Қауіпсіз жіберу үшін жаңартылған браузерде HTTPS сайтты ашыңыз.'));
      var bytes = new window.TextEncoder().encode(JSON.stringify(payload));
      return window.crypto.subtle.digest('SHA-256', bytes).then(function (digest) {
        return Array.from(new Uint8Array(digest)).map(function (byte) { return byte.toString(16).padStart(2, '0'); }).join('');
      });
    }

    function submissionId(payload) {
      if (payload && (payload.photoFile || payload.organPhotoFile)) throw new Error('Фото деректерін сақтау алдында қысқа хэшке ауыстырыңыз.');
      var signature = JSON.stringify(payload);
      if (!state.submission) {
        try { state.submission = JSON.parse(sessionStorage.getItem('forest-id-pending-request') || 'null'); } catch (error) { state.submission = null; }
      }
      if (!state.submission || state.submission.signature !== signature) {
        var id = window.crypto && window.crypto.randomUUID ? window.crypto.randomUUID() : 'req-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2) + '-' + Math.random().toString(36).slice(2);
        state.submission = { signature: signature, requestId: id };
        try { sessionStorage.setItem('forest-id-pending-request', JSON.stringify(state.submission)); } catch (error) { /* Current-tab retries still retain their ID in memory. */ }
      }
      return state.submission.requestId;
    }

    function clearSubmission() {
      state.submission = null;
      try { sessionStorage.removeItem('forest-id-pending-request'); } catch (error) { /* Storage may be unavailable in an embedded browser. */ }
    }

    function updateFormProgress() {
      var fields = Array.from(elements.treeForm.querySelectorAll('[required]'));
      var filled = fields.filter(function (field) { return String(field.value || '').trim(); }).length;
      var progress = Math.max(8, Math.round((filled / fields.length) * 100));
      elements.progressBar.style.width = progress + '%';
      elements.requiredProgress.textContent = 'Міндетті өрістер: ' + filled + ' / ' + fields.length;
    }

    function fillLocation() {
      var button = document.getElementById('locate-button');
      if (!navigator.geolocation) {
        showToast('GPS бұл браузерде қолдаусыз.');
        return;
      }
      button.disabled = true;
      navigator.geolocation.getCurrentPosition(function (position) {
        elements.treeForm.elements.gps.value = position.coords.latitude.toFixed(6) + ', ' + position.coords.longitude.toFixed(6);
        button.disabled = false;
        updateFormProgress();
        showToast('GPS координаттары толтырылды.');
      }, function () {
        button.disabled = false;
        showToast('Орналасуды анықтауға рұқсат берілмеді.');
      }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
    }

    function callServer(method, argument) {
      if (publicMethods.indexOf(method) === -1) return Promise.reject(new Error('Бұл әрекетке рұқсат жоқ.'));
      if (hasExternalRuntime) return httpCall(method, argument);
      if (usesAppsScriptBridge()) {
        return new Promise(function (resolve, reject) {
          var runner = window.google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject);
          if (typeof argument === 'undefined') runner[method]();
          else runner[method](argument);
        });
      }
      if (state.mode !== 'preview') return Promise.reject(new Error('Деректер серверімен байланыс жоғалды. Бетті қайта жүктеңіз.'));
      return mockCall(method, argument);
    }

    function externalRuntime() {
      var runtime = window.FOREST_ID_RUNTIME;
      if (!runtime || runtime.mode !== 'production') throw new Error('Сайттың production баптаулары дұрыс емес.');
      var api;
      var site;
      try {
        api = new URL(runtime.apiUrl);
        site = new URL(runtime.siteUrl);
      } catch (error) {
        throw new Error('Сайт пен деректер серверінің мекенжайларын тексеріңіз.');
      }
      if (api.protocol !== 'https:' || api.hostname !== 'script.google.com' || api.port || api.username || api.password || api.search || api.hash || !/^\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(api.pathname)) {
        throw new Error('Деректер серверінің HTTPS /exec мекенжайы дұрыс емес.');
      }
      if (site.protocol !== 'https:' || !/^[a-z0-9-]+\.github\.io$/.test(site.hostname) || site.port || site.username || site.password || site.search || site.hash || !/^\/(?:[A-Za-z0-9_.-]+\/?)*$/.test(site.pathname)) {
        throw new Error('GitHub Pages сайтының HTTPS мекенжайы дұрыс емес.');
      }
      if (site.pathname.slice(-1) !== '/') site.pathname += '/';
      return { apiUrl: api.toString(), siteUrl: site.toString() };
    }

    function httpCall(method, argument) {
      var runtime;
      try { runtime = externalRuntime(); } catch (error) { return Promise.reject(error); }
      if (typeof window.fetch !== 'function' || typeof window.AbortController !== 'function') return Promise.reject(new Error('Браузерді жаңартып, қайта көріңіз.'));
      var controller = new window.AbortController();
      var options = { credentials: 'omit', redirect: 'follow', signal: controller.signal };
      var url = new URL(runtime.apiUrl);
      if (method === 'submitTree') {
        options.method = 'POST';
        options.headers = { 'Content-Type': 'text/plain;charset=UTF-8' };
        options.body = JSON.stringify({ method: method, argument: argument });
      } else {
        options.method = 'GET';
        url.searchParams.set('action', method);
        if (method === 'getTreePassport') url.searchParams.set('forestId', String(argument || ''));
        if (method === 'getTreePhoto') {
          url.searchParams.set('forestId', String(argument && argument.forestId || ''));
          url.searchParams.set('slot', String(argument && argument.slot || ''));
        }
        if (method === 'getCatalog') {
          url.searchParams.set('query', String(argument && argument.query || ''));
          url.searchParams.set('structure', String(argument && argument.structure || ''));
        }
      }
      var timeoutMs = method === 'submitTree' && argument && (argument.photoFile || argument.organPhotoFile) ? 90000 : 45000;
      var timeout = window.setTimeout(function () { controller.abort(); }, timeoutMs);
      return window.fetch(url.toString(), options)
        .then(function (response) {
          if (!response.ok) throw new Error('Деректер сервері HTTP ' + response.status + ' қатесін қайтарды. Қайта көріңіз.');
          return response.json().catch(function () { throw new Error('Деректер серверінің жауабы дұрыс емес. Қайта көріңіз.'); });
        })
        .then(function (envelope) {
          if (!envelope || typeof envelope !== 'object' || Array.isArray(envelope)) throw new Error('Деректер серверінің жауабы дұрыс емес.');
          if (envelope.ok === false) throw new Error(typeof envelope.error === 'string' ? envelope.error : 'Сервер әрекетті орындай алмады.');
          if (envelope.ok !== true || !Object.prototype.hasOwnProperty.call(envelope, 'data')) throw new Error('Деректер серверінің жауабы расталмады.');
          return envelope.data;
        })
        .catch(function (error) {
          if (error && error.name === 'AbortError') throw new Error('Сервердің жауабын күту уақыты аяқталды. Қайта көріңіз.');
          if (error && error.name === 'TypeError') throw new Error('Деректер серверіне қосылу мүмкін болмады. Интернет қосылымын тексеріп, қайта көріңіз.');
          throw error;
        })
        .finally(function () { window.clearTimeout(timeout); });
    }

    function mockCall(method, argument) {
      return new Promise(function (resolve, reject) {
        window.setTimeout(function () {
          try {
            if (method === 'getBootstrapData') {
              var records = demoRecords.map(withPassportUrl);
              resolve({ config: state.config, records: records, stats: calculateStats(records) });
              return;
            }
            if (method === 'getTreePassport') {
              var id = normaliseForestId(argument);
              var found = demoRecords.find(function (record) { return record.forestId === id; });
              if (!found) throw new Error('Жарияланған паспорт табылмады.');
              resolve(withPassportUrl(found));
              return;
            }
            if (method === 'submitTree') {
              // Even internal callers must not persist photo bytes in demo storage.
              if (argument && (argument.photoFile || argument.organPhotoFile || argument.treePhoto || argument.organPhoto)) throw new Error('Демо режимде фото серверге жіберілмейді. Жарияланған сайтты ашыңыз.');
              var submissions = JSON.parse(localStorage.getItem('forest-id-demo-submissions') || '[]');
              var existing = submissions.find(function (submission) { return argument.requestId && submission.requestId === argument.requestId; });
              if (existing) {
                resolve({ ok: true, forestId: existing.forestId, status: existing.status, message: 'Демо жазбасы осы браузерде бұрын сақталған. Оқытушыға жіберілген жоқ.' });
                return;
              }
              var number = Number(localStorage.getItem('forest-id-demo-sequence') || 3) + 1;
              localStorage.setItem('forest-id-demo-sequence', String(number));
              var forestId = 'FOREST-' + String(number).padStart(5, '0');
              submissions.push(Object.assign({}, argument, { forestId: forestId, status: 'ҚАРАЛУДА' }));
              localStorage.setItem('forest-id-demo-submissions', JSON.stringify(submissions));
              resolve({ ok: true, forestId: forestId, status: 'ҚАРАЛУДА', message: 'Демо жазбасы тек осы браузерде сақталды. Оқытушыға жіберілген жоқ.' });
              return;
            }
            throw new Error('Белгісіз функция: ' + method);
          } catch (error) {
            reject(error);
          }
        }, method === 'submitTree' ? 700 : 180);
      });
    }

    function hasAppsScriptBridge() {
      return Boolean(window.google && window.google.script && window.google.script.run);
    }

    function usesAppsScriptBridge() {
      return !hasExternalRuntime && hasAppsScriptBridge();
    }

    function withPassportUrl(record) {
      var copy = Object.assign({}, record);
      copy.passportUrl = hasExternalRuntime ? buildPassportUrl(copy.forestId) : copy.passportUrl || buildPassportUrl(copy.forestId);
      return copy;
    }

    function buildPassportUrl(forestId) {
      try {
        var base = hasExternalRuntime ? externalRuntime().siteUrl : state.config.appUrl || (state.mode === 'preview' ? window.location.origin + window.location.pathname : '');
        if (!base) return '';
        var url = new URL(base);
        url.searchParams.set('tree', forestId);
        url.hash = '';
        return url.toString();
      } catch (error) { return ''; }
    }

    function publicPassportUrl(value) {
      try {
        var base = publicSiteUrl();
        if (!base) return '';
        var url = new URL(value);
        var site = new URL(base);
        var forestId = url.searchParams.get('tree');
        if (url.origin !== site.origin || url.pathname !== site.pathname || url.username || url.password || url.hash || Array.from(url.searchParams.keys()).join(',') !== 'tree' || !/^FOREST-\d{5,8}$/.test(forestId) || Number(forestId.slice(7)) < 1) return '';
        return url.toString();
      } catch (error) { return ''; }
    }

    function calculateStats(records) {
      return {
        published: records.length,
        species: new Set(records.map(function (r) { return String(r.scientificName || '').toLocaleLowerCase(); }).filter(Boolean)).size,
        groups: new Set(records.map(function (r) { return String(r.academicGroup || '').toLocaleLowerCase(); }).filter(Boolean)).size
      };
    }

    function animateNumber(element, target) {
      if (!element) return;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        element.textContent = String(target);
        return;
      }
      var started = performance.now();
      var duration = 650;
      function frame(now) {
        var progress = Math.min(1, (now - started) / duration);
        element.textContent = String(Math.round(target * (1 - Math.pow(1 - progress, 3))));
        if (progress < 1) requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    function showToast(message) {
      elements.toast.textContent = message;
      elements.toast.hidden = false;
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(function () { elements.toast.hidden = true; }, 3500);
    }

    function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(function () { showToast('Сілтеме көшірілді.'); }).catch(function () { showToast('Көшіру мүмкін болмады. Сілтемені қолмен таңдаңыз.'); });
        return;
      }
      var area = document.createElement('textarea');
      area.value = text;
      area.style.position = 'fixed';
      area.style.opacity = '0';
      document.body.appendChild(area);
      area.select();
      var copied = document.execCommand('copy');
      area.remove();
      showToast(copied ? 'Сілтеме көшірілді.' : 'Көшіру мүмкін болмады. Сілтемені қолмен таңдаңыз.');
    }

    function formatHumanDate(value) {
      if (!value) return '—';
      var date = new Date(value);
      if (isNaN(date.getTime())) return String(value);
      var months = ['қаңтар', 'ақпан', 'наурыз', 'сәуір', 'мамыр', 'маусым', 'шілде', 'тамыз', 'қыркүйек', 'қазан', 'қараша', 'желтоқсан'];
      return date.getUTCDate() + ' ' + months[date.getUTCMonth()] + ' ' + date.getUTCFullYear();
    }

    function valueWithUnit(value, unit) {
      return value === '' || value == null ? '—' : String(value) + ' ' + unit;
    }

    function safeHttps(value) {
      try {
        var url = new URL(String(value || ''));
        return url.protocol === 'https:' && !url.username && !url.password ? url.toString() : '';
      } catch (error) { return ''; }
    }

    function normaliseForestId(value) {
      var id = String(value || '').trim().toUpperCase();
      var match = id.match(/^(?:FOREST-?)?(\d{1,8})$/);
      return match ? 'FOREST-' + String(Number(match[1])).padStart(5, '0') : id;
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>'"]/g, function (character) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[character];
      });
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replace(/`/g, '&#96;');
    }

    function errorMessage(error) {
      return error && error.message ? error.message : String(error || 'Белгісіз қате');
    }

    function debounce(fn, delay) {
      var timer;
      return function () {
        var args = arguments;
        clearTimeout(timer);
        timer = setTimeout(function () { fn.apply(null, args); }, delay);
      };
    }
  }());
</script>
